spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.clickpesa.enabled=${CLICKPESA_ENABLED:false}
app.clickpesa.base-url=https://api.clickpesa.com/third-parties
app.clickpesa.client-id=${CLICKPESA_CLIENT_ID:}
app.clickpesa.api-key=${CLICKPESA_API_KEY:}
app.clickpesa.checksum-key=${CLICKPESA_CHECKSUM_KEY:}
# Admin Panel: IP zinazoruhusiwa (tenganisha kwa koma). Tupu = zote (wakati wa ujenzi tu)
app.admin.allowed-ips=
# DEV ONLY: code ya kubadilisha nenosiri kwenye jibu la API. Weka false kwenye production.
app.dev.expose-reset-code=true
# Arifa (FCM): njia ya service account key. Tupu = arifa zimezimwa
app.firebase.credentials=${FIREBASE_CREDENTIALS:}
# Simu za sauti: TURN server (coturn). Tupu = STUN tu (inafanya kazi kwenye WiFi moja)
app.turn.urls=${TURN_URLS:}
app.turn.secret=${TURN_SECRET:}
