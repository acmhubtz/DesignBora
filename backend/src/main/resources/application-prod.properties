# =============================================================
# PRODUCTION - inawashwa kwa: SPRING_PROFILES_ACTIVE=prod
# Siri zote zinatoka env, HAKUNA thamani mbadala:
# env ikikosekana, server inakataa kuwaka (salama kuliko kutumia ya majaribio).
# =============================================================

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Usalama
app.jwt.secret=${JWT_SECRET}
app.dev.expose-reset-code=false
app.admin.allowed-ips=${ADMIN_ALLOWED_IPS}

# Malipo halisi (si mock)
app.clickpesa.enabled=true
app.clickpesa.client-id=${CLICKPESA_CLIENT_ID}
app.clickpesa.api-key=${CLICKPESA_API_KEY}
app.clickpesa.checksum-key=${CLICKPESA_CHECKSUM_KEY}

# Arifa
app.firebase.credentials=${FIREBASE_CREDENTIALS}

# Mafaili yahifadhiwe nje ya folda ya code
app.storage.base-path=${STORAGE_PATH:/var/lib/designbora/storage}

# Nyuma ya Nginx: soma IP halisi ya mteja (X-Forwarded-For)
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=always
logging.level.root=INFO
