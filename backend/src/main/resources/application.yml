server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/designbora}
    username: ${DB_USERNAME:designbora}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  storage:
    base-path: ./storage
    documents-path: documents
    portfolio-path: portfolio
    drafts-path: drafts
    finals-path: finals
  platform:
    fee-type: PERCENTAGE
    fee-fixed-amount: 1000
    fee-percentage: 10.0